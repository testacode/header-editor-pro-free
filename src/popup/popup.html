<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Header Editor Pro - Free</title>
  </head>
  <body>
    <!-- Profile Sidebar -->
    <div class="sidebar">
      <div class="sidebar-top">
        <div id="profile-circles">
          <!-- Profile circles will be added here dynamically -->
        </div>
        <div class="add-profile-circle" id="add-profile" title="Add Profile">
          <svg viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg>
        </div>
      </div>
      <div class="sidebar-bottom">
        <div class="info-circle" id="info-circle" title="Extension Info">
          <svg viewBox="0 0 192 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M48 80a48 48 0 1 1 96 0A48 48 0 1 1 48 80zM0 224c0-17.7 14.3-32 32-32l64 0c17.7 0 32 14.3 32 32l0 224 32 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 512c-17.7 0-32-14.3-32-32s14.3-32 32-32l32 0 0-192-32 0c-17.7 0-32-14.3-32-32z"/></svg>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="profile-info">
          <input
            class="profile-name-input"
            id="profile-name-input"
            type="text"
            value="Default"
          />
        </div>
        <div class="toolbar-actions">
          <button class="toolbar-btn" id="refresh-btn" title="Refresh">
            <svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M386.3 160L336 160c-17.7 0-32 14.3-32 32s14.3 32 32 32l128 0c17.7 0 32-14.3 32-32l0-128c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 51.2L414.4 97.6c-87.5-87.5-229.3-87.5-316.8 0s-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3s163.8-62.5 226.3 0L386.3 160z"/></svg>
          </button>
          <button class="toolbar-btn" id="pause-btn" title="Pause Extension">
            <svg viewBox="0 0 320 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M48 64C21.5 64 0 85.5 0 112L0 400c0 26.5 21.5 48 48 48l32 0c26.5 0 48-21.5 48-48l0-288c0-26.5-21.5-48-48-48L48 64zm192 0c-26.5 0-48 21.5-48 48l0 288c0 26.5 21.5 48 48 48l32 0c26.5 0 48-21.5 48-48l0-288c0-26.5-21.5-48-48-48l-32 0z"/></svg>
          </button>
          <button
            class="toolbar-btn"
            id="pin-btn"
            title="Pin (Disable auto-close)"
          >
            <svg viewBox="0 0 384 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M32 32C32 14.3 46.3 0 64 0L320 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-29.5 0 11.4 148.2c36.7 19.9 65.7 53.2 79.5 94.7l1 3c3.3 9.8 1.6 20.5-4.4 28.8s-15.7 13.3-26 13.3L32 352c-10.3 0-19.9-4.9-26-13.3s-7.7-19.1-4.4-28.8l1-3c13.8-41.5 42.8-74.8 79.5-94.7L93.5 64 64 64C46.3 64 32 49.7 32 32zM160 384l64 0 0 96c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-96z"/></svg>
          </button>
          <button class="toolbar-btn" id="color-picker-btn" title="Profile Color">
            <svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M512 256c0 .9 0 1.8 0 2.7c-.4 36.5-33.6 61.3-70.1 61.3L344 320c-26.5 0-48 21.5-48 48c0 3.4 .4 6.7 1 9.9c2.1 10.2 6.5 20 10.8 29.9c6.1 13.8 12.1 27.5 12.1 42c0 31.8-21.6 60.7-53.4 62c-3.5 .1-7 .2-10.6 .2C114.6 512 0 397.4 0 256S114.6 0 256 0S512 114.6 512 256zM128 288a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm0-96a32 32 0 1 0 0-64 32 32 0 1 0 0 64zM288 96a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm96 96a32 32 0 1 0 0-64 32 32 0 1 0 0 64z"/></svg>
          </button>
          <button class="toolbar-btn" id="menu-btn" title="Menu">
            <svg viewBox="0 0 128 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M64 360a56 56 0 1 0 0 112 56 56 0 1 0 0-112zm0-160a56 56 0 1 0 0 112 56 56 0 1 0 0-112zM120 96A56 56 0 1 0 8 96a56 56 0 1 0 112 0z"/></svg>
          </button>
        </div>
      </div>

      <!-- Dropdown Menu -->
      <div class="dropdown-menu" id="profile-dropdown" style="display: none">
        <div class="dropdown-item" id="import-item">
          <svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M128 64c0-35.3 28.7-64 64-64L352 0l0 128c0 17.7 14.3 32 32 32l128 0 0 288c0 35.3-28.7 64-64 64l-256 0c-35.3 0-64-28.7-64-64l0-112 174.1 0-39 39c-9.4 9.4-9.4 24.6 0 33.9s24.6 9.4 33.9 0l80-80c9.4-9.4 9.4-24.6 0-33.9l-80-80c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l39 39L128 288l0-224zm0 224l0 48L24 336c-13.3 0-24-10.7-24-24s10.7-24 24-24l104 0zM512 128l-128 0L384 0 512 128z"/></svg>
          <span>Import Configuration</span>
        </div>
        <div class="dropdown-item" id="export-item">
          <svg viewBox="0 0 576 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M0 64C0 28.7 28.7 0 64 0L224 0l0 128c0 17.7 14.3 32 32 32l128 0 0 128-168 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l168 0 0 112c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 64zM384 336l0-48 110.1 0-39-39c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l80 80c9.4 9.4 9.4 24.6 0 33.9l-80 80c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l39-39L384 336zm0-208l-128 0L256 0 384 128z"/></svg>
          <span>Export Configuration</span>
        </div>
        <div class="dropdown-item" id="delete-profile-item">
          <svg viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M135.2 17.7C140.6 6.8 151.7 0 163.8 0L284.2 0c12.1 0 23.2 6.8 28.6 17.7L320 32l96 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 96C14.3 96 0 81.7 0 64S14.3 32 32 32l96 0 7.2-14.3zM32 128l384 0 0 320c0 35.3-28.7 64-64 64L96 512c-35.3 0-64-28.7-64-64l0-320zm96 64c-8.8 0-16 7.2-16 16l0 224c0 8.8 7.2 16 16 16s16-7.2 16-16l0-224c0-8.8-7.2-16-16-16zm96 0c-8.8 0-16 7.2-16 16l0 224c0 8.8 7.2 16 16 16s16-7.2 16-16l0-224c0-8.8-7.2-16-16-16zm96 0c-8.8 0-16 7.2-16 16l0 224c0 8.8 7.2 16 16 16s16-7.2 16-16l0-224c0-8.8-7.2-16-16-16z"/></svg>
          <span>Delete Profile</span>
        </div>
      </div>

      <!-- Import/Export Modal -->
      <div class="modal-overlay" id="modal-overlay" style="display: none">
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title" id="modal-title">Import Configuration</h3>
            <button class="modal-close" id="modal-close">
              <svg viewBox="0 0 384 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
            </button>
          </div>
          <div class="modal-body">
            <!-- Export/Import Options -->
            <div class="modal-options" id="modal-options">
              <div class="option-group">
                <label class="option-label">Export scope:</label>
                <div class="radio-group">
                  <label class="radio-option">
                    <input
                      type="radio"
                      name="export-scope"
                      value="current"
                      checked
                    />
                    <span>Current profile only</span>
                  </label>
                  <label class="radio-option">
                    <input type="radio" name="export-scope" value="all" />
                    <span>All profiles</span>
                  </label>
                </div>
              </div>

              <div class="option-group" id="import-options">
                <label class="option-label">Import mode:</label>
                <div class="radio-group">
                  <label class="radio-option">
                    <input
                      type="radio"
                      name="import-mode"
                      value="new"
                      checked
                    />
                    <span>Create new profile</span>
                  </label>
                  <label class="radio-option">
                    <input type="radio" name="import-mode" value="replace" />
                    <span>Replace current profile</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="textarea-container">
              <textarea
                id="json-textarea"
                placeholder="Paste your JSON configuration here..."
                rows="10"
              ></textarea>
              <div class="validation-message" id="validation-message"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
            <button class="btn btn-primary" id="modal-action">Import</button>
            <button class="btn btn-copy" id="modal-copy" style="display: none">
              <svg viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M208 0L332.1 0c12.7 0 24.9 5.1 33.9 14.1l67.9 67.9c9 9 14.1 21.2 14.1 33.9L448 336c0 26.5-21.5 48-48 48l-192 0c-26.5 0-48-21.5-48-48l0-288c0-26.5 21.5-48 48-48zM48 128l80 0 0 64-64 0 0 256 192 0 0-32 64 0 0 48c0 26.5-21.5 48-48 48L48 512c-26.5 0-48-21.5-48-48L0 176c0-26.5 21.5-48 48-48z"/></svg> Copy
            </button>
            <button class="btn btn-copy" id="modal-download" style="display: none">
              <svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 242.7-73.4-73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l128 128c12.5 12.5 32.8 12.5 45.3 0l128-128c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L288 274.7 288 32zM64 352c-35.3 0-64 28.7-64 64l0 32c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-32c0-35.3-28.7-64-64-64l-101.5 0-45.3 45.3c-25 25-65.5 25-90.5 0L165.5 352 64 352zm368 56a24 24 0 1 1 0 48 24 24 0 1 1 0-48z"/></svg> Download
            </button>
          </div>
        </div>
      </div>

      <!-- Color Picker Modal -->
      <div class="modal-overlay" id="color-picker-overlay" style="display: none">
        <div class="modal color-picker-modal">
          <div class="modal-header">
            <h3 class="modal-title">Profile Color</h3>
            <button class="modal-close" id="color-picker-close">
              <svg viewBox="0 0 384 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="color-picker-content">
              <div class="color-preview-section">
                <span class="color-preview-label">Preview:</span>
                <div class="color-preview-circle" id="color-preview-circle">
                  <span id="color-preview-text">1</span>
                </div>
              </div>
              
              <div class="color-picker-tabs">
                <button class="color-tab active" id="background-tab">BACKGROUND</button>
                <button class="color-tab" id="text-tab">TEXT COLOR</button>
              </div>
              
              <div class="color-picker-area">
                <div class="color-gradient" id="color-gradient">
                  <div class="color-selector" id="color-selector"></div>
                </div>
                <div class="hue-slider-container">
                  <input type="range" class="hue-slider" id="hue-slider" min="0" max="360" value="180">
                </div>
              </div>
              
              <div class="preset-colors">
                <div class="preset-color" data-color="#ffffff" style="background: #ffffff;"></div>
                <div class="preset-color" data-color="#000000" style="background: #000000;"></div>
                <div class="preset-color" data-color="#4caf50" style="background: #4caf50;"></div>
                <div class="preset-color" data-color="#2196f3" style="background: #2196f3;"></div>
                <div class="preset-color" data-color="#ff9800" style="background: #ff9800;"></div>
                <div class="preset-color" data-color="#f44336" style="background: #f44336;"></div>
                <div class="preset-color" data-color="#9c27b0" style="background: #9c27b0;"></div>
                <div class="preset-color" data-color="#ffc107" style="background: #ffc107;"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="color-picker-cancel">Cancel</button>
            <button class="btn btn-primary" id="color-picker-save">Save</button>
          </div>
        </div>
      </div>

      <!-- Profile Description -->
      <div
        class="profile-description"
        id="profile-description"
        style="display: none"
      >
        <input
          class="description-input"
          id="description-input"
          type="text"
          placeholder="Click to add description..."
        />
      </div>

      <!-- Content -->
      <div class="content">
        <!-- Request Headers Section -->
        <div class="section" id="request-section">
          <div class="section-header">
            <span class="section-title">Request headers</span>
          </div>
          <div class="section-content">
            <div id="request-headers-list">
              <!-- Request headers will be added here -->
            </div>
            <button class="add-header-btn" id="add-request-header">
              <svg viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg> Add header
            </button>
          </div>
        </div>

        <!-- Response Headers Section -->
        <div class="section" id="response-section">
          <div class="section-header">
            <span class="section-title">Response headers</span>
          </div>
          <div class="section-content">
            <div id="response-headers-list">
              <!-- Response headers will be added here -->
            </div>
            <button class="add-header-btn" id="add-response-header">
              <svg viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg> Add header
            </button>
          </div>
        </div>

        <!-- Filters Section -->
        <div class="section" id="filters-section">
          <div class="section-header">
            <span class="section-title">Filters</span>
          </div>
          <div class="section-content">
            <div class="filter-item" id="domain-filter-item">
              <input
                type="checkbox"
                class="header-checkbox"
                id="domain-filter-enabled"
                title="Limit this profile to these domains"
              />
              <span class="filter-label">Domains</span>
              <input
                type="text"
                class="filter-domains-input"
                id="domain-filter-input"
                placeholder="example.com, api.example.com"
              />
            </div>
            <div class="filter-item" id="tab-group-filter-item" style="display: none">
              <input
                type="checkbox"
                class="header-checkbox"
                id="tab-group-filter-enabled"
                title="Limit this profile to a tab group"
              />
              <span class="filter-label">Tab group</span>
              <select class="filter-group-select" id="tab-group-filter-select">
                <option value="">Select a tab group…</option>
              </select>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Info tooltip -->
    <div class="info-tooltip" id="info-tooltip" style="display: none">
      <div class="tooltip-arrow"></div>
      <div class="tooltip-content">
        <div class="tooltip-item">
          <svg viewBox="0 0 496 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16 8.8-27.1 16-33.7-55.9-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114.8 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.9c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2z"/></svg>
          <a href="https://github.com/testacode/header-editor-pro-free" target="_blank">GitHub</a>
